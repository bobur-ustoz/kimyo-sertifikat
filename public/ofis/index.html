<script type="module">

const $ = (id) => document.getElementById(id);

const GURUH = { "Kontent": 0xffd633, "O'quvchilar": 0x41e08a, "Platforma": 0x4d8bff, "Nazorat": 0xa98bff };
const BELGI = { faol: "Bugun ishlagan", ishlayapti: "Hozir ishlayapti", savol: "Sizdan javob kutyapti", xato: "Xato bor", kutmoqda: "Kutmoqda", yoq: "Hali qurilmagan" };
const HOLAT = { ishlaydi: "Ishlaydi", sinovda: "O'rgatilgan, sinovda", qurilmagan: "Qurilmagan" };
const vaqt = (t) => { if (!t) return ""; const d = new Date(t), s = (Date.now() - d) / 3600e3;
  const soat = d.toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit", timeZone: "Asia/Tashkent" }), kun = d.toLocaleDateString("ru-RU", { day: "numeric", month: "numeric", timeZone: "Asia/Tashkent" });

// Ma'lumot manbai: kompyuterda mahalliy server (malumot.json), saytda esa faqat adminga javob beradigan server.
// Saytda admin panelga kirgan odamning sessiyasi ishlatiladi (shu brauzerda saqlangan); sessiya bo'lmasa hech narsa ko'rsatilmaydi.
async function yukla() {
  if (["localhost", "127.0.0.1"].includes(location.hostname)) {
    try { const r = await fetch("malumot.json", { cache: "no-store" }); if (r.ok) return await r.json(); } catch {}
  }
  const kalit = Object.keys(localStorage).find((k) => /^sb-.+-auth-token$/.test(k));
  let token = null; try { token = kalit && JSON.parse(localStorage.getItem(kalit))?.access_token; } catch {}
  if (!token) throw new Error("Admin hisobi bilan kiring: avval admin panelni oching.");
  const r = await fetch("/api/bunny-auth", { method: "POST", headers: { Authorization: `Bearer ${token}`, "Content-Type": "application/json" }, body: JSON.stringify({ ofis: true }) });
  if (r.status === 401) throw new Error("Sessiya eskirgan: admin panelni yangilab, qayta oching.");
  if (r.status === 403) throw new Error("Bu sahifa faqat admin uchun.");
  if (!r.ok) throw new Error("Server javob bermadi. Birozdan keyin qayta urinib ko'ring.");
  return r.json();
}
let D;
try { D = await yukla(); }
catch (e) { $("xabar").textContent = e.message || "Ma'lumot olinmadi."; throw e; }
$("xabar").remove();
$("yangilandi").textContent = `${D.agentlar.length} agent · yangilandi: ${vaqt(D.vaqt)}`;
if (D.ogohlantirish) $("ogoh").textContent = D.ogohlantirish;

// ================= 3D sahna =================
const TELEFON = Math.min(innerWidth, innerHeight) < 760;
const renderer = new THREE.WebGLRenderer({ antialias: !TELEFON, alpha: true, powerPreference: "high-performance" });
renderer.setPixelRatio(Math.min(devicePixelRatio, TELEFON ? 1.5 : 2)); renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05; renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene(); scene.fog = new THREE.Fog(0x060a1c, 90, 220);
const camera = new THREE.PerspectiveCamera(36, innerWidth / innerHeight, 0.1, 600);
const FK = 0.84;                                     // ko'rish burchagi kengaygani uchun masofalar shuncha qisqaradi
const controls = new OrbitControls(camera, renderer.domElement);
// Erkin kamera: har tomondan aylantirish, tepadan to'g'ri qarash, deyarli yer sathigacha tushish.
controls.enableDamping = true; controls.dampingFactor = 0.08; controls.screenSpacePanning = false; controls.minDistance = 6; controls.maxDistance = 170;
controls.minPolarAngle = 0.02; controls.maxPolarAngle = 1.46; controls.autoRotateSpeed = 0.9; controls.zoomToCursor = true;

scene.add(new THREE.HemisphereLight(0xdfe8ff, 0x1a2a70, 1.3));
const quyosh = new THREE.DirectionalLight(0xffffff, 2.0); quyosh.position.set(18, 30, 12); quyosh.castShadow = true;
quyosh.shadow.mapSize.set(TELEFON ? 2048 : 4096, TELEFON ? 2048 : 4096); Object.assign(quyosh.shadow.camera, { left: -24, right: 24, top: 24, bottom: -24, near: 1, far: 90 }); quyosh.shadow.bias = -0.0005; quyosh.shadow.radius = 3;
scene.add(quyosh);

const mk = new Map();
const mat = (color, o = {}) => { const k = color + JSON.stringify(o); if (!mk.has(k)) mk.set(k, new THREE.MeshStandardMaterial({ color, roughness: 0.55, metalness: 0.05, ...o })); return mk.get(k); };
const nk = new Map();
const nur = (color, kuch = 1.6) => { const k = color + ":" + kuch; if (!nk.has(k)) nk.set(k, new THREE.MeshStandardMaterial({ color, emissive: color, emissiveIntensity: kuch, roughness: 0.4 })); return nk.get(k); };
const gk = new Map();
const geo = (k, f) => { if (!gk.has(k)) gk.set(k, f()); return gk.get(k); };
function quti(w, h, d, m, x, y, z, p, r = 0.05) {
  const mayda = Math.max(w, h, d) < 0.75 || r <= 0.02;        // mayda buyumda yumaloq burchak ko'rinmaydi, oddiy quti ancha yengil
  const g = new THREE.Mesh(geo(`q${w},${h},${d},${mayda ? 0 : r}`, () => (mayda ? new THREE.BoxGeometry(w, h, d) : new RoundedBoxGeometry(w, h, d, 2, Math.min(r, w / 2.01, h / 2.01, d / 2.01)))), m);
  g.position.set(x, y, z); g.castShadow = true; g.receiveShadow = true; p.add(g); return g;
}

function shar(r, m, x, y, z, p) { const g = new THREE.Mesh(geo(`h${r}`, () => new THREE.SphereGeometry(r, r < 0.2 ? 12 : 18, r < 0.2 ? 8 : 12)), m); g.position.set(x, y, z); g.castShadow = true; p.add(g); return g; }
function tor(R, r, m, x, y, z, p) { const g = new THREE.Mesh(geo(`t${R},${r}`, () => new THREE.TorusGeometry(R, r, 10, 48)), m); g.position.set(x, y, z); p.add(g); return g; }
function konus(r, h, m, x, y, z, p, seg = 20) { const g = new THREE.Mesh(geo(`k${r},${h},${seg}`, () => new THREE.ConeGeometry(r, h, seg)), m); g.position.set(x, y, z); g.castShadow = true; p.add(g); return g; }
function tasvir(w, h, chiz) { const c = document.createElement("canvas"); c.width = w; c.height = h; chiz(c.getContext("2d"), w, h); const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t; }
const tk = new Map(), dk = new Map();
// Yerdagi yorug'lik dog'i uchun umumiy material: bir xil rangdagilari bitta shaklga birlashadi.
const dog = (color, opacity) => { const k = color + ":" + opacity; if (!dk.has(k)) { const m = new THREE.MeshBasicMaterial({ color, transparent: true, opacity, depthWrite: false }); m.userData.birlashadi = true; dk.set(k, m); } return dk.get(k); };
function tekis(w, h, tex, x, y, z, p, ry = 0, shaffof = false) {
  const k = tex.uuid + shaffof; if (!tk.has(k)) tk.set(k, new THREE.MeshBasicMaterial({ map: tex, toneMapped: false, transparent: shaffof, side: shaffof ? THREE.DoubleSide : THREE.FrontSide, depthWrite: !shaffof }));
  const g = new THREE.Mesh(new THREE.PlaneGeometry(w, h), tk.get(k));
  g.position.set(x, y, z); g.rotation.y = ry; p.add(g); return g;
}
const suzuvchi = [], aylanuvchi = [], miltillovchi = [], robotlar = [];
const KORINMAS = new THREE.MeshBasicMaterial({ visible: false });     // bosishni tutadi, chizilmaydi

// zamin
const yer = new THREE.Mesh(new THREE.CircleGeometry(180, 64), new THREE.MeshStandardMaterial({ color: 0x070c24, roughness: 1 })); yer.rotation.x = -Math.PI / 2; yer.position.y = -1.72; yer.receiveShadow = true; scene.add(yer);
const katak = new THREE.GridHelper(300, 150, 0x1b2b6e, 0x101a48); katak.position.y = -1.71; katak.material.transparent = true; katak.material.opacity = 0.45; scene.add(katak);
const QADAM = 7.5, S = 6.4;
const YOLAK = 3.0;                                   // bo'limlar orasidagi yo'lak kengligi

// ---------- robot
function robot(p, rang, uxlaydi) {
  const g = new THREE.Group(); g.position.set(0.55, 0, -0.35); g.rotation.y = 0.62; p.add(g);
  const tana = new THREE.Group(); g.add(tana);
  const oqM = mat(uxlaydi ? 0x9aa3c7 : 0xf2f5ff, { roughness: 0.28, metalness: 0.08 }), rM = mat(rang, { roughness: 0.35 });
  const gavda = new THREE.Mesh(geo("gavda", () => new THREE.CapsuleGeometry(0.4, 0.36, 8, 24)), oqM); gavda.position.y = 0.9; gavda.castShadow = true; tana.add(gavda);
  tor(0.41, 0.045, rM, 0, 0.83, 0, tana).rotation.x = Math.PI / 2;
  const kokrak = new THREE.Mesh(geo("kokrak", () => new THREE.CircleGeometry(0.11, 24)), uxlaydi ? mat(0x4a5480) : nur(rang, 1.6)); kokrak.position.set(0, 1.03, 0.402); tana.add(kokrak);
  const bosh = new THREE.Group(); bosh.position.y = 1.7; tana.add(bosh);
  const kalla = new THREE.Mesh(geo("kalla", () => new THREE.SphereGeometry(0.44, 32, 24)), oqM); kalla.scale.set(1.12, 0.92, 1); kalla.castShadow = true; bosh.add(kalla);
  const niqob = new THREE.Mesh(geo("niqob", () => new THREE.SphereGeometry(0.37, 32, 24)), mat(0x070d2c, { roughness: 0.15, metalness: 0.4 })); niqob.scale.set(1.02, 0.6, 0.5); niqob.position.set(0, 0.02, 0.27); bosh.add(niqob);
  const kozM = uxlaydi ? mat(0x39426e) : nur(0xffd633, 2.6);
  const kozlar = [-0.15, 0.15].map((x) => { const k = new THREE.Mesh(geo("koz", () => new THREE.CapsuleGeometry(0.046, 0.08, 6, 12)), kozM); k.position.set(x, 0.03, 0.445); if (uxlaydi) k.scale.y = 0.15; bosh.add(k); return k; });
  [-1, 1].forEach((s) => { sil(0.1, 0.1, 0.09, rM, s * 0.5, 0, 0, bosh).rotation.z = Math.PI / 2; });

    b.y.style.display = korinadi ? "" : "none"; if (korinadi) { b.y.style.left = `${(v.x * 0.5 + 0.5) * innerWidth}px`; b.y.style.top = `${(-v.y * 0.5 + 0.5) * innerHeight}px`; }
  }
  if (devorOzgardi) renderer.shadowMap.needsUpdate = true;
  renderer.render(scene, camera);
}
